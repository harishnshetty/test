apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-ebs
spec:
  containers:
  - name: nginx
    image: harishnshetty/iphone:latest
    ports:
    - containerPort: 80
    volumeMounts:
    - name: nginx-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: nginx-storage
    persistentVolumeClaim:
      claimName: nginx-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-service
spec:
  selector:
    app: nginx-ebs
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer