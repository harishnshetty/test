apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    app: nginx-ebs
spec:
  containers:
  - name: nginx
    image: harishnshetty/iphone:latest
    ports:
    - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-service
spec:
  selector:
    app: nginx-ebs
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer